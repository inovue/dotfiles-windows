# Starship Prompt Configuration
format = """
[┌──](bold green)$directory$git_branch$git_status$nodejs$rust$python$golang
[└─>](bold green) """

right_format = """$cmd_duration$time"""

# Inserts a blank line between shell prompts
add_newline = true

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"

[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "bold cyan"

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
style = "bold red"
format = '([\[$all_status$ahead_behind\]]($style) )'

[nodejs]
symbol = " "
style = "bold green"

[rust]
symbol = "🦀 "
style = "bold red"

[python]
symbol = " "
style = "bold yellow"

[golang]
symbol = " "
style = "bold cyan"

[cmd_duration]
min_time = 2_000
style = "bold yellow"
format = "[$duration]($style) "

[time]
disabled = false
time_format = "%R"
style = "dimmed white"
format = "[$time]($style)"
