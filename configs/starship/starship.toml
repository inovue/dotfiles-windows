"$schema" = 'https://starship.rs/config-schema.json'

palette = "catppuccin_mocha"

right_format = """$cmd_duration$time"""

# Inserts a blank line between shell prompts
add_newline = true

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold lavender)"

[directory]
style = "bold lavender"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"
home_symbol = "~"

[git_branch]
symbol = " "
style = "bold mauve"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold red"
format = '([\[$all_status$ahead_behind\]]($style) )'

[nodejs]
symbol = " "
style = "bold green"
format = "via [$symbol($version )]($style)"

[rust]
symbol = "󱘗 "
style = "bold peach"
format = "via [$symbol($version )]($style)"

[python]
symbol = " "
style = "bold yellow"
format = 'via [${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[golang]
symbol = " "
style = "bold sapphire"
format = "via [$symbol($version )]($style)"

[docker_context]
symbol = " "
style = "bold blue"
format = "via [$symbol$context]($style) "

[cmd_duration]
min_time = 2_000
style = "bold peach"
format = "took [$duration]($style) "

[time]
disabled = false
time_format = "%R"
style = "subtext0"
format = "[$time]($style)"

[aws]
symbol = " "

[azure]
symbol = " "

[battery]
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol = "󰂑 "
empty_symbol = "󰂎 "

[bun]
symbol = " "

[c]
symbol = " "

[cpp]
symbol = " "

[cmake]
symbol = " "

[deno]
symbol = " "

[dotnet]
symbol = " "

[gcloud]
symbol = "󱇶 "

[java]
symbol = " "

[julia]
symbol = " "

[kotlin]
symbol = " "

[kubernetes]
symbol = "󱃾 "

[lua]
symbol = " "

[package]
symbol = "󰏗 "

[terraform]
symbol = " "

[zig]
symbol = " "

