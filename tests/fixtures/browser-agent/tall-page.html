<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tall Page Fixture</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font: 2rem system-ui, sans-serif;
    }
    #s1 { background: #dbeafe; }
    #s2 { background: #bfdbfe; }
    #s3 { background: #93c5fd; }
    #s4 { background: #60a5fa; }
    #s5 { background: #3b82f6; color: #fff; }
  </style>
</head>
<body>
  <section id="s1">Screen 1</section>
  <section id="s2">Screen 2</section>
  <section id="s3">Screen 3</section>
  <section id="s4">Screen 4</section>
  <section id="s5">Screen 5</section>
</body>
</html>
